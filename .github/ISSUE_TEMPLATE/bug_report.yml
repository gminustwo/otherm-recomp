name: Bug report
description: Something crashes, freezes, looks wrong, sounds wrong or doesn't respond.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! A few details make a problem much quicker to find and fix. One problem per issue, please.
        **Attach the log of the play session where the problem happened**: a bug report can't be sent without it. "Session log" below says where it is.

  - type: input
    id: version
    attributes:
      label: Other M Recompiled version
      description: Options (Start + Back together, or F1) > Game > Update shows it, e.g. "v0.1.0". It is also on the log's first line.
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Steam Deck (the AppImage)
        - Linux desktop (the AppImage)
        - Windows (built from source)
        - Linux (built from source)
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw or heard, and what you expected instead.
      placeholder: "The game froze for a second every few seconds, and the sound crackled."
    validations:
      required: true

  - type: textarea
    id: where
    attributes:
      label: Where, and how to make it happen
      description: The area and room (or menu, cutscene, loading screen) and the moment. Does it happen every time? The steps to get there help a lot.
      placeholder: |
        Sector 1, the room after the first Save Room, when the rain starts. Every time.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Session log (required)
      description: |
        **A bug report needs the log of the play session where the problem happened.** Every start of the game makes a new folder in `UserData/Logs`, named `base_<number>_pid<number>` (the first number counts seconds, so a later start has a bigger one), with the session's `console.log` inside. A later start never overwrites an earlier log, but it does add a newer folder: pick the folder of the session where the problem happened by its date and time, and drag its `console.log` into this box. Folders older than 4 days are deleted, so attach it soon.
        - **Steam Deck / Linux**: `UserData/Logs` in the folder that holds the AppImage
        - **Windows**: `UserData\Logs` next to `MetroidOtherM.exe`

        It lists your settings and what the game was doing in a slow frame, a freeze or a crash. It also shows folder paths, which can include your user name: edit those out if you like.
      placeholder: "Drop console.log here"
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Your controller (and whether you start the game through Steam), your display and the aspect ratio and frame rate you play at, a texture pack if you use one, your CPU and graphics card.
      placeholder: "Steam Deck controls, started from Steam in Game Mode; 1280x800 at 60 fps; no texture pack"

  - type: textarea
    id: media
    attributes:
      label: Screenshots or video
      description: For anything you can see, a screenshot or a short clip (drag it in) shows it best.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I'm playing my own disc image of the USA release (R3OE01, revision 1)
          required: true
        - label: The log I attached is from the play session where the problem happened, not from a later start of the game (I checked its folder's date and time)
          required: true
        - label: I looked at the open issues, and this one isn't there yet
